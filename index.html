<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>엔지니어링 & 생활 공학 단위 변환기 | Quick EngConverter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- 네비게이션 -->
  <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
        ⚙️ <span>공학 & 실무 단위 변환기</span>
      </h1>
      <span class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1 rounded-full border border-indigo-200">Engineer & Living Tools</span>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-4xl mx-auto w-full flex-grow p-4 md:p-6 space-y-6">
    
    <!-- 카테고리 탭 선택기 -->
    <div class="flex flex-wrap gap-2 justify-center" id="category-tabs">
      <button onclick="changeCategory('length')" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition bg-white text-slate-600 border border-slate-200 hover:bg-slate-100" data-category="length">길이 (Length)</button>
      <button onclick="changeCategory('mass')" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition bg-white text-slate-600 border border-slate-200 hover:bg-slate-100" data-category="mass">무게 (Weight)</button>
      <button onclick="changeCategory('volume')" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition bg-white text-slate-600 border border-slate-200 hover:bg-slate-100" data-category="volume">부피 (Volume)</button>
      <button onclick="changeCategory('pressure')" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition bg-indigo-600 text-white shadow-sm" data-category="pressure">압력 (Pressure)</button>
      <button onclick="changeCategory('torque')" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition bg-white text-slate-600 border border-slate-200 hover:bg-slate-100" data-category="torque">토크 (Torque)</button>
      <button onclick="changeCategory('viscosity')" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition bg-white text-slate-600 border border-slate-200 hover:bg-slate-100" data-category="viscosity">점도 (Viscosity)</button>
      <button onclick="changeCategory('power')" class="tab-btn px-4 py-2 rounded-lg font-medium text-sm transition bg-white text-slate-600 border border-slate-200 hover:bg-slate-100" data-category="power">동력/전력 (Power)</button>
    </div>

    <!-- 변환기 카드 -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 md:p-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        
        <!-- 입력부 -->
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">입력 단위 및 값</label>
          <div class="flex gap-2">
            <input type="number" id="input-val" value="1" step="any" oninput="calculate()" class="w-2/3 px-4 py-2.5 text-lg font-semibold bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
            <select id="input-unit" onchange="calculate()" class="w-1/3 px-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none"></select>
          </div>
        </div>

        <!-- 변환 대상 선택 -->
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">출력 단위</label>
          <select id="output-unit" onchange="calculate()" class="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-lg font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none"></select>
        </div>
      </div>

      <!-- 결과 디스플레이 -->
      <div class="mt-8 p-5 rounded-xl bg-slate-900 text-white flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
          <span class="text-xs text-slate-400 block font-medium">변환 결과</span>
          <div class="text-3xl font-extrabold tracking-tight text-indigo-400 mt-0.5" id="output-val">0</div>
        </div>
        <button onclick="copyResult()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-md border border-slate-700 transition active:scale-95">결과 복사</button>
      </div>

      <!-- 전체 단위 한눈에 보기 테이블 -->
      <div class="mt-8">
        <h2 class="text-sm font-bold text-slate-700 mb-3">모든 단위로 변환된 값</h2>
        <div class="overflow-x-auto border border-slate-100 rounded-lg">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-100 text-slate-600 text-xs font-semibold">
              <tr>
                <th class="px-4 py-2">단위 (Unit)</th>
                <th class="px-4 py-2 text-right">변환값 (Value)</th>
              </tr>
            </thead>
            <tbody id="all-units-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 광고 배너 플레이스홀더 -->
    <div class="w-full bg-slate-200 border border-dashed border-slate-300 rounded-xl py-6 flex items-center justify-center text-slate-400 text-xs">
      Google AdSense 배너 영역 (반응형 디스플레이 광고)
    </div>

  </main>

  <footer class="py-6 text-center text-xs text-slate-400 border-t border-slate-200 bg-white">
    © 2026 Quick EngConverter. All rights reserved.
  </footer>

  <script>
    // 단위 데이터 및 SI 기준 단위 정의
    const unitData = {
      length: {
        base: 'm',
        units: {
          'mm (밀리미터)': 0.001,
          'cm (센티미터)': 0.01,
          'm (미터)': 1,
          'km (킬로미터)': 1000,
          'in (인치)': 0.0254,
          'ft (피트)': 0.3048,
          'yd (야드)': 0.9144,
          'mil (밀)': 0.0000254
        }
      },
      mass: {
        base: 'kg',
        units: {
          'g (그램)': 0.001,
          'kg (킬로그램)': 1,
          'ton (톤)': 1000,
          'lb (파운드)': 0.45359237,
          'oz (온스)': 0.0283495,
          'mg (밀리그램)': 1e-6
        }
      },
      volume: {
        base: 'L',
        units: {
          'mL / cc': 0.001,
          'L (리터)': 1,
          'm³ (입방미터)': 1000,
          'cm³ (입방센티미터)': 0.001,
          'gal (미국 갤런)': 3.78541,
          'fl oz (액량 온스)': 0.0295735,
          'in³ (입방인치)': 0.016387
        }
      },
      pressure: {
        base: 'Pa',
        units: {
          'MPa': 1e6,
          'bar': 1e5,
          'kPa': 1e3,
          'kgf/cm²': 98066.5,
          'psi': 6894.76,
          'atm': 101325,
          'Pa': 1
        }
      },
      torque: {
        base: 'N·m',
        units: {
          'N·m': 1,
          'kgf·m': 9.80665,
          'kgf·cm': 0.0980665,
          'lbf·ft': 1.35582,
          'lbf·in': 0.112985
        }
      },
      viscosity: {
        base: 'm²/s',
        units: {
          'cSt (mm²/s)': 1e-6,
          'St (cm²/s)': 1e-4,
          'm²/s': 1,
          'ft²/s': 0.092903
        }
      },
      power: {
        base: 'W',
        units: {
          'kW': 1000,
          'PS (마력)': 735.5,
          'HP (마력)': 745.7,
          'W': 1,
          'kcal/h': 1.163
        }
      }
    };

    let currentCategory = 'length';

    function changeCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.dataset.category === cat) {
          btn.className = 'tab-btn px-4 py-2 rounded-lg font-medium text-sm transition bg-indigo-600 text-white shadow-sm';
        } else {
          btn.className = 'tab-btn px-4 py-2 rounded-lg font-medium text-sm transition bg-white text-slate-600 border border-slate-200 hover:bg-slate-100';
        }
      });
      initSelectors();
      calculate();
    }

    function initSelectors() {
      const inSelect = document.getElementById('input-unit');
      const outSelect = document.getElementById('output-unit');
      const units = Object.keys(unitData[currentCategory].units);

      inSelect.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join('');
      outSelect.innerHTML = units.map((u, i) => `<option value="${u}" ${i === 1 ? 'selected' : ''}>${u}</option>`).join('');
    }

    function calculate() {
      const val = parseFloat(document.getElementById('input-val').value) || 0;
      const inUnit = document.getElementById('input-unit').value;
      const outUnit = document.getElementById('output-unit').value;
      const catUnits = unitData[currentCategory].units;

      // 1. Base 단위로 환산 후 타겟 단위로 재환산
      const valInBase = val * catUnits[inUnit];
      const result = valInBase / catUnits[outUnit];

      // 결과 디스플레이
      document.getElementById('output-val').innerText = formatValue(result) + ' ' + outUnit;

      // 전체 단위 테이블 렌더링
      const tbody = document.getElementById('all-units-body');
      tbody.innerHTML = Object.keys(catUnits).map(u => {
        const uVal = valInBase / catUnits[u];
        return `
          <tr class="hover:bg-slate-50">
            <td class="px-4 py-2 text-slate-700 font-medium">${u}</td>
            <td class="px-4 py-2 text-right font-mono text-slate-900">${formatValue(uVal)}</td>
          </tr>
        `;
      }).join('');
    }

    function formatValue(num) {
      if (num === 0) return '0';
      if (Math.abs(num) >= 1e6 || (Math.abs(num) < 0.001 && Math.abs(num) > 0)) {
        return num.toExponential(4);
      }
      return Number(num.toFixed(4)).toLocaleString();
    }

    function copyResult() {
      const text = document.getElementById('output-val').innerText;
      navigator.clipboard.writeText(text);
      alert('결과가 클립보드에 복사되었습니다: ' + text);
    }

    // 기본 초기화 (길이 탭 기본 선택)
    changeCategory('length');
  </script>
</body>
</html>
